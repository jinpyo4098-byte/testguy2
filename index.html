
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Gravity Arrow - Professional Edition</title>
    <style>
        /* 기본 문서 스타일 지정 및 스크롤 방지 */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* 게임 화면을 감싸는 메인 컨테이너 레이아웃 */
        #game-container {
            position: relative;
            width: 1000px;
            height: 650px;
            margin-top: 10px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #334155;
        }

        /* 캔버스 기본 스타일 */
        canvas {
            background: transparent;
            display: block;
        }

        /* 인터랙티브 요소를 배치하기 위한 상위 UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 마우스 이벤트를 허용하는 클래스 정의 */
        .interactive {
            pointer-events: auto;
        }

        /* 상단 정보창 컨테이너 */
        #header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        /* 글래스모피즘 스타일 패널 정의 */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 스코어 타이틀 스타일 */
        #score-box h1 {
            margin: 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94a3b8;
        }

        /* 점수 텍스트 스타일 */
        #score-disp {
            font-size: 38px;
            font-weight: 800;
            margin: 0;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        /* 행성 선택 버튼 그룹 바형 레이아웃 */
        #planet-selector {
            display: flex;
            gap: 12px;
        }

        /* 개별 행성 선택용 버튼 컴포넌트 */
        .planet-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #475569;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0;
            overflow: hidden;
        }

        /* 버튼 호버 시 시각 효과 */
        .planet-btn:hover {
            transform: scale(1.12);
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        /* 활성화된 현재 행성 버튼 스타일 정의 */
        .planet-btn.active {
            border-color: #0ea5e9;
            background: rgba(14, 165, 233, 0.15);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
            transform: scale(1.05);
        }

        /* 행성 아이콘 전용 내장형 캔버스 */
        .planet-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        /* 콤보 알림 컴포넌트 래퍼 위치 조절 */
        #combo-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -120%) scale(1);
            text-align: center;
            transition: all 0.2s ease-out;
        }

        /* 강력한 임팩트 효과를 부여한 콤보 텍스트 디자인 */
        #combo-disp {
            font-size: 46px;
            font-weight: 900;
            font-style: italic;
            color: #f43f5e;
            text-shadow: 0 0 16px rgba(244, 63, 94, 0.6), 0 4px 6px rgba(0,0,0,0.4);
            margin: 0;
            animation: pulse 0.4s ease-out infinite alternate;
        }

        /* 콤보 연출을 위한 크기 변화 애니메이션 */
        @keyframes pulse {
            0% { transform: scale(0.96); }
            100% { transform: scale(1.04); }
        }

        /* 히든 처리 유틸리티 클래스 */
        .hidden {
            display: none !important;
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- 메인 프레임워크 게임 컨테이너 단락 배포 -->
    <div id="game-container">
        <!-- 그래픽 렌더링을 위한 HTML5 기본 캔버스 -->
        <canvas id="gameCanvas" width="1000" height="650"></canvas>
        
        <!-- 실시간 데이터 흐름을 표기할 UI 레이어 단락 -->
        <div id="ui-layer">
            <div id="header-info">
                <!-- 현재 누적 스코어 표기 영역 -->
                <div id="score-box" class="glass-panel">
                    <h1>Score</h1>
                    <p id="score-disp">0</p>
                </div>
                
                <!-- 상단 우측 행성 선택 버튼 인터페이스 리스트 -->
                <div id="planet-selector" class="interactive">
                    <button class="planet-btn active" onclick="selectPlanet('earth')" id="btn-earth"></button>
                    <button class="planet-btn" onclick="selectPlanet('moon')" id="btn-moon"></button>
                    <button class="planet-btn" onclick="selectPlanet('mars')" id="btn-mars"></button>
                    <button class="planet-btn" onclick="selectPlanet('venus')" id="btn-venus"></button>
                    <button class="planet-btn" onclick="selectPlanet('europa')" id="btn-europa"></button>
                </div>
            </div>
            
            <!-- 콤보 달성 시 드러나는 중앙 알림 레이아웃 -->
            <div id="combo-wrapper" class="hidden">
                <p id="combo-disp">1 COMBO</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>

</body>
</html>
