<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 배경 원 (귀여운 느낌) -->
  <circle cx="50" cy="50" r="48" fill="#7c3aed" opacity="0.9"/>
  <circle cx="50" cy="50" r="45" fill="#a78bfa"/>
  
  <!-- 하이라이트 (반짝이는 효과) -->
  <circle cx="35" cy="35" r="12" fill="#ffffff" opacity="0.3"/>
  
  <!-- 귀여운 화살 (흰색) -->
  <g transform="translate(50, 50)">
    <!-- 화살 몸통 -->
    <rect x="-5" y="-20" width="10" height="35" fill="#ffffff" rx="3"/>
    
    <!-- 화살 머리 (상단 삼각형) -->
    <polygon points="0,-22 -10,-8 10,-8" fill="#ffffff"/>
    
    <!-- 화살 깃털 좌측 -->
    <polygon points="-5,8 -15,12 -8,15" fill="#ffffff" opacity="0.8"/>
    
    <!-- 화살 깃털 우측 -->
    <polygon points="5,8 15,12 8,15" fill="#ffffff" opacity="0.8"/>
    
    <!-- 화살 끝 동그란 모양 (귀여움) -->
    <circle cx="0" cy="18" r="4" fill="#ffd700"/>
  </g>
</svg>